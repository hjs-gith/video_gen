[project]
name = "video-generator"
version = "0.1.0"
description = "AI Jargon Atlas — bilingual short-form video course pipeline"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "moviepy>=2.2.1",
    "openai>=2.38.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "supertonic>=1.3.1",
]

[project.scripts]
atlas = "atlas_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
